<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Almacén de obra</title>
<style>:root{font-family:system-ui,sans-serif;color:#17324d;background:#f3f6f8}*{box-sizing:border-box}body{margin:0}header{background:#17324d;color:white;padding:18px}h1{margin:0;font-size:21px}main{max-width:1100px;margin:auto;padding:16px}section{background:white;padding:16px;margin:12px 0;border-radius:12px}nav{display:flex;gap:8px;overflow:auto}button{background:#116e9c;color:white;border:0;border-radius:8px;padding:10px 14px;font:inherit;cursor:pointer}button.secondary{background:#dae8ef;color:#17324d}label{display:block;margin:8px 0 3px;font-size:13px;font-weight:600}input,select{width:100%;padding:10px;border:1px solid #bbcbd5;border-radius:7px;font:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px}.line{border:1px solid #d7e0e5;padding:10px;border-radius:8px;margin:10px 0}.scroll{overflow:auto}table{min-width:650px;width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid #e4eaf0;font-size:14px}.error{color:#ae182d}small{color:#5a7180}</style></head>
<body><header><h1>Almacén de obra</h1></header><main><section id="login"><p>Accede con tu cuenta Google autorizada.</p><div id="signin"></div></section><div id="app" hidden><small id="who"></small><nav><button onclick="view('stock')">Stock</button><button onclick="view('moves')">Movimientos</button><button class="write" onclick="view('receipt')">Recepción</button><button class="write" onclick="view('transfer')">Mover</button></nav><p id="status"></p>
<section id="stock"><h2>Existencias</h2><input id="search" placeholder="Buscar material, referencia, proyecto o zona" oninput="renderStock()"><div class="scroll"><table><thead><tr><th>Material</th><th>Referencia</th><th>Proyecto</th><th>Zona</th><th>Disponible</th></tr></thead><tbody id="stockRows"></tbody></table></div></section>
<section id="moves" hidden><h2>Movimientos recientes</h2><div class="scroll"><table><thead><tr><th>Fecha</th><th>Lote</th><th>Material</th><th>Cantidad</th><th>Origen → destino</th><th>Estado</th><th>Acción</th></tr></thead><tbody id="moveRows"></tbody></table></div></section>
<section id="receipt" hidden><h2>Nueva recepción</h2><div class="grid"><div><label>Proyecto</label><select id="rProject"></select></div><div><label>Zona de almacén</label><select id="rZone"></select></div><div><label>Proveedor</label><input id="supplier"></div><div><label>Nº albarán o factura</label><input id="document"></div></div><label>Enlace al documento (opcional)</label><input id="documentUrl" placeholder="https://..."><label>Observaciones</label><input id="rNote"><div id="receiptLines"></div><button class="secondary" onclick="addLine()">+ Línea</button> <button onclick="saveReceipt()">Registrar recepción</button></section>
<section id="transfer" hidden><h2>Mover material</h2><div class="grid"><div><label>Proyecto</label><select id="mProject" onchange="available()"></select></div><div><label>Origen</label><select id="mOrigin" onchange="available()"></select></div><div><label>Destino</label><select id="mDestination"></select></div></div><label>Material disponible</label><select id="mMaterial"></select><label>Cantidad</label><input id="mQuantity" type="number" min="0.001" step="0.001"><label>Motivo</label><input id="mNote"><p><button onclick="saveMove()">Registrar movimiento</button></p></section></div></main>
<script>
// Configurar estos dos valores antes de publicar. El origen autorizado se define en Apps Script.
const CLIENT_ID='879636449979-tl4u210nduk4vbqdfj5hl151483m9qja.apps.googleusercontent.com';
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbx86icSTjNwO65y20Lvwf-rDMUAfPbb1s_Ct7YIa9W2DPgeKl5ByOMGZYXvq2TGQ74/exec';
const SCRIPT_ORIGIN='https://script.google.com';
let credential='',state={},pendingReceipt='',pendingMove='';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function status(s,error=false){$('status').textContent=s;$('status').className=error?'error':''}
function call(action,data={}){return new Promise((resolve,reject)=>{
  const requestId='req_'+crypto.randomUUID(), frame=document.createElement('iframe'), form=document.createElement('form');
  frame.name='frame_'+requestId;frame.hidden=true;form.method='POST';form.action=SCRIPT_URL;form.target=frame.name;form.hidden=true;
  const finish=()=>{clearTimeout(timer);window.removeEventListener('message',onMessage);frame.remove();form.remove()};
  const onMessage=e=>{let origin;try{origin=new URL(e.origin)}catch{return}
    if(origin.protocol!=='https:' || !(origin.hostname==='script.google.com'||origin.hostname==='script.googleusercontent.com'||origin.hostname.endsWith('-script.googleusercontent.com')))return;
    const p=e.data;if(!p||p.source!=='ALMACEN_OBRA'||p.requestId!==requestId)return;
    finish();p.ok?resolve(p.result):reject(Error(p.message||'Error del servidor'))};
  const timer=setTimeout(()=>{finish();reject(Error('No hay respuesta del servidor. Comprueba el despliegue y la conexión.'))},30000);
  window.addEventListener('message',onMessage);
  Object.entries({requestId,action,credential,data:JSON.stringify(data)}).forEach(([key,value])=>{let i=document.createElement('input');i.type='hidden';i.name=key;i.value=value;form.appendChild(i)});
  document.body.append(frame,form);form.submit();
})}
function choices(id,items,key,label){$(id).replaceChildren(...items.map(item=>{let o=document.createElement('option');o.value=item[key];o.textContent=item[label]||item[key];return o}))}
function view(id){['stock','moves','receipt','transfer'].forEach(x=>$(x).hidden=x!==id);if(id==='moves')refresh()}
function renderStock(){let q=$('search').value.toLocaleLowerCase('es');$('stockRows').innerHTML=(state.stock||[]).filter(x=>[x.description,x.reference,x.project,x.zone].join(' ').toLocaleLowerCase('es').includes(q)).map(x=>`<tr><td>${esc(x.description)}</td><td>${esc(x.reference)}</td><td>${esc(x.project)}</td><td>${esc(x.zone)}</td><td>${esc(x.quantity)} ${esc(x.unit)}</td></tr>`).join('')||'<tr><td colspan="5">Sin existencias.</td></tr>'}
function renderMoves(){let seen=new Set();$('moveRows').innerHTML=(state.movements||[]).map(x=>{let camp=state.zones.some(z=>z.CODIGO===x.DESTINO&&z.AREA==='CAMPA');let button=camp&&x.ESTADO==='PENDIENTE'&&!seen.has(x.ID_LOTE)?`<button data-batch="${esc(x.ID_LOTE)}" onclick="confirmMove(this.dataset.batch)">Recibido</button>`:'';seen.add(x.ID_LOTE);return `<tr><td>${esc(x.FECHA.slice(0,16).replace('T',' '))}</td><td>${esc(x.ID_LOTE.slice(0,8))}</td><td>${esc(x.DESCRIPCION)}</td><td>${esc(x.CANTIDAD)} ${esc(x.UNIDAD)}</td><td>${esc(x.ORIGEN||'Proveedor')} → ${esc(x.DESTINO)}</td><td>${esc(x.ESTADO)}</td><td>${button}</td></tr>`}).join('')||'<tr><td colspan="7">Sin movimientos.</td></tr>'}
function available(){let p=$('mProject').value,z=$('mOrigin').value;choices('mMaterial',(state.stock||[]).filter(x=>x.project===p&&x.zone===z).map(x=>({id:x.materialId,label:`${x.description} — ${x.quantity} ${x.unit}`})),'id','label')}
function addLine(){let d=document.createElement('div');d.className='line grid';d.innerHTML='<div><label>Descripción</label><input class="description"></div><div><label>Referencia</label><input class="reference"></div><div><label>Fabricante</label><input class="manufacturer"></div><div><label>Unidad</label><select class="unit"><option>ud</option><option>m</option><option>kg</option><option>l</option><option>rollo</option><option>caja</option></select></div><div><label>Cantidad recibida</label><input class="quantity" type="number" step="0.001" min="0.001"></div><div><label>Cantidad esperada</label><input class="expected" type="number" step="0.001" min="0.001"></div><div><label>Incidencia</label><input class="incident"></div><div><label>&nbsp;</label><button class="secondary" onclick="this.closest(\'.line\').remove()">Quitar</button></div>';$('receiptLines').append(d)}
function value(d,cls){return d.querySelector('.'+cls).value.trim()}
async function saveReceipt(){let lines=[...document.querySelectorAll('#receiptLines .line')].map(d=>Object.fromEntries(['description','reference','manufacturer','unit','quantity','expected','incident'].map(k=>[k,value(d,k)])));let p={batchId:pendingReceipt||'op_'+crypto.randomUUID(),project:$('rProject').value,zone:$('rZone').value,supplier:$('supplier').value,document:$('document').value,documentUrl:$('documentUrl').value,note:$('rNote').value,lines};pendingReceipt=p.batchId;try{status('Guardando...');let r=await call('createReceipt',p);pendingReceipt='';status(`Recepción ${r.batchId.slice(0,8)}: ${r.lines} líneas registradas.`);$('receiptLines').replaceChildren();addLine();await refresh();view('stock')}catch(e){status(e.message,true)}}
async function saveMove(){let p={batchId:pendingMove||'op_'+crypto.randomUUID(),project:$('mProject').value,origin:$('mOrigin').value,destination:$('mDestination').value,note:$('mNote').value,lines:[{materialId:$('mMaterial').value,quantity:$('mQuantity').value}]};pendingMove=p.batchId;try{status('Guardando...');let r=await call('moveStock',p);pendingMove='';status(`Movimiento ${r.batchId.slice(0,8)} registrado.`);await refresh();view('moves')}catch(e){status(e.message,true)}}
async function confirmMove(batchId){try{await call('confirmCamp',{batchId});status('Recepción en campa confirmada.');await refresh();view('moves')}catch(e){status(e.message,true)}}
async function refresh(){let r=await call('getStock');state.stock=r.stock;state.movements=r.movements;renderStock();renderMoves();available()}
async function signedIn(r){credential=r.credential;try{state=await call('bootstrap');$('login').hidden=true;$('app').hidden=false;$('who').textContent=`${state.user.name} · ${state.user.role}`;document.querySelectorAll('.write').forEach(b=>b.hidden=!['ALMACEN','ADMIN'].includes(state.user.role));choices('rProject',state.projects,'CODIGO','CODIGO');choices('mProject',state.projects,'CODIGO','CODIGO');choices('rZone',state.zones.filter(z=>z.AREA==='ALMACEN'),'CODIGO','NOMBRE');choices('mOrigin',state.zones,'CODIGO','NOMBRE');choices('mDestination',state.zones,'CODIGO','NOMBRE');addLine();await refresh()}catch(e){$('login').insertAdjacentHTML('beforeend',`<p class="error">${esc(e.message)}</p>`)}}
function initGoogle(){google.accounts.id.initialize({client_id:CLIENT_ID,callback:signedIn,ux_mode:'popup'});google.accounts.id.renderButton($('signin'),{theme:'outline',size:'large',text:'signin_with',width:250})}
</script><script src="https://accounts.google.com/gsi/client" async defer onload="initGoogle()"></script></body></html>
